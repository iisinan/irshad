services:
  # 1. The React Frontend (Static Site)
  - type: web
    name: irshad-frontend
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to the URL of irshad-backend

  # 2. The Laravel Backend
  - type: web
    name: irshad-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false # Render will ask you to fill this in manually
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # Render will ask you to fill this in manually with your Neon DB string
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: irshad-redis
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: PORT
        value: 8080
      - key: AI_ENGINE_URL
        sync: false # Set to the Render URL of your irshad-ai-engine service
      - key: GEMINI_API_KEY
        sync: false # Required for the background cron job to extract PDFs

  # 3. The Python AI Engine
  - type: web
    name: irshad-ai-engine
    env: docker
    dockerContext: backend/ai-engine
    dockerfilePath: backend/ai-engine/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # Neon DB connection string
      - key: GEMINI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: PORT
        value: 8000

  # 4. The Flutter Mobile Web Preview
  - type: web
    name: irshad-mobile-web
    env: docker
    dockerContext: .
    dockerfilePath: mobile.Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 80 # Nginx default in the Dockerfile

  # 5. Redis Cache & Queue Broker
  - type: redis
    name: irshad-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
