<!doctype html>
<html lang="en" class="no-scroll">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="dns-prefetch" href="https://irshad-backend-production.up.railway.app" />
    <link rel="preconnect" href="https://irshad-backend-production.up.railway.app" crossorigin />
    <link rel="dns-prefetch" href="https://api.iirshad.com" />
    <link rel="preconnect" href="https://api.iirshad.com" crossorigin />
    <title>IRSHAD - Islamic Wealth Management</title>
    <script>
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      // Safety fallback to unblock page overlay if React mount or auth check takes longer than 1.5s
      setTimeout(function() {
        var splash = document.getElementById('irshad-splash');
        if (splash) {
          splash.classList.add('splash-hidden');
          document.body.classList.remove('no-scroll');
          document.documentElement.classList.remove('no-scroll');
          setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
        }
      }, 1500);
    </script>
    <style>
      body, html { margin: 0; padding: 0; background-color: var(--bg-alt, #F0F3F7); }
      body.no-scroll, html.no-scroll { height: 100%; overflow: hidden; }
      #irshad-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-alt, #F0F3F7);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-20px);
      }
      .splash-logo {
        width: 90px;
        height: auto;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 15px 35px rgba(201, 149, 42, 0.25));
      }
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: .6;
          transform: scale(0.95);
        }
      }
      .splash-hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(1.02);
      }
    </style>
  </head>
  <body class="no-scroll">
    <div id="irshad-splash" class="splash-container">
      <div class="splash-content">
        <img src="/logo.svg" alt="Irshad Logo" class="splash-logo" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
